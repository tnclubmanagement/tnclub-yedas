{% assign s = site.data.strings[site.active_lang] | default: site.data.strings.vi %}
<footer>
  <div class="container-md beautiful-jekyll-footer">
    <div class="row">
      <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
        <div class="footer-row footer-row-top">
          <span>{{ s.ui.footer_slogan }}</span>
        </div>
        <div class="footer-row footer-row-bottom">
          <nav class="footer-compact-links" aria-label="{{ s.ui.footer_links }}">
            <a class="footer-icon-link" href="{{ '/contact/' | relative_url }}" title="{{ s.ui.contact }}" aria-label="{{ s.ui.contact }}" data-placement="top">
              <span class="fas fa-envelope" aria-hidden="true"></span>
            </a>
            <a class="footer-icon-link" href="{{ '/privacy/' | relative_url }}" title="{{ s.ui.privacy }}" aria-label="{{ s.ui.privacy }}" data-placement="top">
              <span class="fas fa-shield-alt" aria-hidden="true"></span>
            </a>
          </nav>
          <span class="copyright">
            {{ site.author }} &nbsp;•&nbsp; {{ site.time | date: '%Y' }}
          </span>
        </div>
      </div>
    </div>
  </div>
</footer>
