<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" rx="24" fill="#EEF1F6"/>

  <rect x="24" y="24" width="360" height="372" rx="16" fill="#FDECEC"/>
  <rect x="416" y="24" width="360" height="372" rx="16" fill="#E9F9F2"/>

  <text x="204" y="56" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#D14343" text-anchor="middle">✗ Đứng chụp từ trên xuống</text>
  <text x="596" y="56" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#1E9E6B" text-anchor="middle">✓ Hạ thấp ngang tầm hoa</text>

  <!-- Panel trai: nguoi dung cao, cui nhin xuong hoa be -->
  <g>
    <!-- mat dat -->
    <line x1="60" y1="350" x2="350" y2="350" stroke="#9AA3AE" stroke-width="3"/>
    <!-- nguoi dung thang -->
    <circle cx="140" cy="140" r="16" fill="#F0C9A0"/>
    <rect x="124" y="156" width="32" height="90" rx="10" fill="#5AA9FF"/>
    <line x1="140" y1="246" x2="140" y2="350" stroke="#5AA9FF" stroke-width="10" stroke-linecap="round"/>
    <!-- duong ngam tu mat xuong hoa -->
    <line x1="150" y1="150" x2="270" y2="330" stroke="#D14343" stroke-width="2.5" stroke-dasharray="6 5"/>
    <!-- hoa be xiu -->
    <circle cx="270" cy="335" r="7" fill="#FF7A8A"/>
    <circle cx="270" cy="335" r="3" fill="#FFC770"/>
    <line x1="270" y1="342" x2="270" y2="350" stroke="#4AD6A8" stroke-width="2"/>
  </g>

  <!-- Panel phai: nguoi cui thap, may ngang tam hoa, hoa to + nen mo -->
  <g>
    <line x1="440" y1="350" x2="760" y2="350" stroke="#9AA3AE" stroke-width="3"/>
    <!-- cham mo lam nen -->
    <g fill="#9FB7C9" opacity="0.5">
      <circle cx="700" cy="300" r="14"/>
      <circle cx="730" cy="260" r="10"/>
      <circle cx="680" cy="250" r="8"/>
    </g>
    <!-- nguoi cui thap -->
    <circle cx="500" cy="290" r="15" fill="#F0C9A0"/>
    <rect x="485" y="305" width="30" height="45" rx="10" fill="#5AA9FF"/>
    <!-- dien thoai ngang tam hoa -->
    <g transform="translate(560,335)">
      <rect x="-10" y="-20" width="20" height="40" rx="5" fill="#1D1D1F"/>
      <rect x="-6" y="-15" width="12" height="30" rx="2" fill="#1E9E6B"/>
    </g>
    <!-- duong ngam thang hang -->
    <line x1="540" y1="330" x2="630" y2="330" stroke="#1E9E6B" stroke-width="2.5" stroke-dasharray="6 5"/>
    <!-- hoa to -->
    <g transform="translate(650,330) scale(2.4)">
      <circle cx="0" cy="0" r="7" fill="#FF7A8A"/>
      <circle cx="0" cy="0" r="3" fill="#FFC770"/>
      <line x1="0" y1="7" x2="0" y2="16" stroke="#4AD6A8" stroke-width="2"/>
    </g>
  </g>
</svg>
