<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B5B95"/>
      <stop offset="55%" stop-color="#FF9F6B"/>
      <stop offset="100%" stop-color="#FFC770"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" rx="24" fill="#EEF1F6"/>

  <rect x="24" y="24" width="752" height="330" rx="16" fill="url(#skyGrad)"/>
  <circle cx="400" cy="300" r="46" fill="#FFF3D6"/>

  <!-- Mat dat -->
  <rect x="24" y="320" width="752" height="34" fill="#2B2B45"/>

  <!-- Silhouette: cay + nguoi dung -->
  <g fill="#1D1D1F">
    <rect x="150" y="230" width="6" height="90"/>
    <circle cx="153" cy="210" r="30"/>
    <circle cx="130" cy="235" r="18"/>
    <circle cx="178" cy="238" r="20"/>

    <circle cx="620" cy="270" r="12"/>
    <rect x="610" y="282" width="20" height="40" rx="6"/>
  </g>

  <!-- Diem cham SAI: vao canh vat (nguoi) -->
  <circle cx="620" cy="280" r="20" fill="none" stroke="#D14343" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="620" y="400" font-family="Arial, sans-serif" font-size="15" fill="#D14343" text-anchor="middle" font-weight="bold">✗ Chạm vào người</text>
  <text x="620" y="422" font-family="Arial, sans-serif" font-size="13" fill="#D14343" text-anchor="middle">→ trời bị "cháy" trắng</text>

  <!-- Diem cham DUNG: vao vung sang canh mat troi -->
  <circle cx="460" cy="290" r="20" fill="none" stroke="#1E9E6B" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="300" y="400" font-family="Arial, sans-serif" font-size="15" fill="#1E9E6B" text-anchor="middle" font-weight="bold">✓ Chạm vào vùng sáng</text>
  <text x="300" y="422" font-family="Arial, sans-serif" font-size="13" fill="#1E9E6B" text-anchor="middle">→ cảnh vật thành bóng đen (silhouette)</text>
</svg>
