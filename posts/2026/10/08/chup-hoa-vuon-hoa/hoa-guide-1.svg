<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <rect width="1200" height="800" fill="#f8f9fa"/>
  <text x="600" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#1d1d1f">Mẹo 1: Chọn 1 bông làm chủ thể</text>

  <!-- Phone outline -->
  <rect x="420" y="160" width="360" height="560" rx="32" fill="#ffffff" stroke="#1d1d1f" stroke-width="6"/>
  <rect x="440" y="200" width="320" height="480" fill="#e8f5e9"/>

  <!-- Flower in center -->
  <g transform="translate(600, 420)">
    <circle r="90" fill="#ff6b35" opacity="0.9"/>
    <circle r="40" fill="#1d1d1f" opacity="0.15"/>
    <circle r="24" fill="#1d1d1f" opacity="0.3"/>
  </g>

  <!-- Surrounding blurry flowers (smaller, lighter) -->
  <circle cx="520" cy="300" r="40" fill="#ff9e80" opacity="0.4"/>
  <circle cx="700" cy="320" r="45" fill="#ff9e80" opacity="0.35"/>
  <circle cx="500" cy="500" r="35" fill="#ff9e80" opacity="0.3"/>
  <circle cx="720" cy="520" r="38" fill="#ff9e80" opacity="0.32"/>

  <!-- Focus ring -->
  <circle cx="600" cy="420" r="120" fill="none" stroke="#0071e3" stroke-width="5" stroke-dasharray="12 8"/>

  <!-- Hand / tap indicator -->
  <circle cx="600" cy="420" r="18" fill="none" stroke="#0071e3" stroke-width="4"/>
  <line x1="600" y1="420" x2="600" y2="420" stroke="#0071e3" stroke-width="4" stroke-linecap="round"/>

  <!-- Step numbers -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#1d1d1f">
    <text x="100" y="280" font-weight="600" fill="#0071e3">1.</text>
    <text x="140" y="280">Tìm bông đẹp nhất</text>
    <text x="100" y="360" font-weight="600" fill="#0071e3">2.</text>
    <text x="140" y="360">Chạm lấy nét vào bông đó</text>
    <text x="100" y="440" font-weight="600" fill="#0071e3">3.</text>
    <text x="140" y="440">Để hậu cảnh tự làm mờ</text>
  </g>

  <!-- Arrows connecting steps to phone -->
  <line x1="340" y1="280" x2="480" y2="350" stroke="#0071e3" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="340" y1="360" x2="500" y2="390" stroke="#0071e3" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <line x1="340" y1="440" x2="490" y2="430" stroke="#0071e3" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <text x="600" y="760" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#6e6e73">Không cần chụp cả vườn — chỉ cần 1 bông nổi bật.</text>
</svg>
