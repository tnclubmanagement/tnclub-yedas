<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" width="1200" height="800">
  <rect width="1200" height="800" fill="#f8f9fa"/>
  <text x="600" y="60" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#1d1d1f">Mẹo 2: Hạ thấp máy xuống ngang tầm hoa</text>

  <!-- Ground -->
  <rect x="0" y="680" width="1200" height="120" fill="#e8f0e1"/>

  <!-- Person crouching -->
  <g transform="translate(300, 360)">
    <!-- Legs -->
    <line x1="50" y1="280" x2="120" y2="340" stroke="#1d1d1f" stroke-width="8" stroke-linecap="round"/>
    <line x1="120" y1="340" x2="200" y2="340" stroke="#1d1d1f" stroke-width="8" stroke-linecap="round"/>
    <!-- Body -->
    <line x1="80" y1="280" x2="80" y2="160" stroke="#1d1d1f" stroke-width="10" stroke-linecap="round"/>
    <!-- Head -->
    <circle cx="80" cy="120" r="35" fill="none" stroke="#1d1d1f" stroke-width="6"/>
    <!-- Arms holding phone low -->
    <line x1="80" y1="180" x2="180" y2="260" stroke="#1d1d1f" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="180" x2="180" y2="220" stroke="#1d1d1f" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Phone -->
  <g transform="translate(440, 540) rotate(-15)">
    <rect x="0" y="0" width="140" height="80" rx="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="5"/>
    <rect x="10" y="10" width="120" height="60" fill="#d4e9f7"/>
  </g>

  <!-- Flower at eye level -->
  <g transform="translate(620, 520)">
    <!-- Stem -->
    <line x1="0" y1="180" x2="0" y2="0" stroke="#4a7c59" stroke-width="8" stroke-linecap="round"/>
    <!-- Flower -->
    <circle r="70" fill="#ff6b35" opacity="0.95"/>
    <circle r="28" fill="#1d1d1f" opacity="0.15"/>
  </g>

  <!-- Arrow showing eye level -->
  <line x1="360" y1="480" x2="560" y2="520" stroke="#0071e3" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.7"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#0071e3"/>
    </marker>
  </defs>

  <!-- Tips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#1d1d1f" transform="translate(800, 260)">
    <text x="0" y="0" font-weight="600" fill="#0071e3">1.</text>
    <text x="40" y="0">Ngồi hoặc cúi xuống</text>
    <text x="0" y="60" font-weight="600" fill="#0071e3">2.</text>
    <text x="40" y="60">Đưa máy ngang tầm hoa</text>
    <text x="0" y="120" font-weight="600" fill="#0071e3">3.</text>
    <text x="40" y="120">Hậu cảnh tự động mờ xa</text>
  </g>

  <text x="600" y="760" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#6e6e73">Tránh đứng chụp từ trên cao — góc quen thuộc dễ nhàm chán.</text>
</svg>
