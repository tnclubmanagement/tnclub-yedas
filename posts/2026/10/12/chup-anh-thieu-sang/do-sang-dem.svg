  <g font-family="sans-serif" text-anchor="middle">
    <g transform="translate(45 90)"><rect width="275" height="230" rx="16" fill="#344054"/><circle cx="220" cy="70" r="50" fill="#fff"/><path d="M35 190h170l-60-85z" fill="#667085"/><text x="137" y="280" fill="#cbd5e1" font-size="18">Nâng sáng toàn cảnh</text><text x="137" y="310" fill="#ff8f8f" font-size="17">→ đèn bị cháy</text></g>
    <g transform="translate(362 90)"><rect width="275" height="230" rx="16" fill="#202b42"/><circle cx="220" cy="70" r="42" fill="#ffd166"/><path d="M35 190h170l-60-105z" fill="#4b5563"/><circle cx="220" cy="70" r="58" fill="none" stroke="#ff7b9c" stroke-width="4" stroke-dasharray="8 7"/><text x="137" y="280" fill="#cbd5e1" font-size="18">Chạm vào vùng sáng</text><text x="137" y="310" fill="#9ee6d0" font-size="17">→ giữ màu đèn</text></g>
    <g transform="translate(679 90)"><rect width="275" height="230" rx="16" fill="#17253d"/><circle cx="220" cy="70" r="35" fill="#ffd166"/><path d="M35 190h170l-60-105z" fill="#8290a8"/><circle cx="220" cy="70" r="50" fill="none" stroke="#ff7b9c" stroke-width="4" stroke-dasharray="8 7"/><text x="137" y="280" fill="#cbd5e1" font-size="18">Hạ sáng nhẹ</text><text x="137" y="310" fill="#9ee6d0" font-size="17">→ ảnh có chiều sâu</text></g>
  </g>
