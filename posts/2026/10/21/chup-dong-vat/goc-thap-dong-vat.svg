<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" rx="24" fill="#EEF1F6"/>

  <rect x="24" y="24" width="360" height="372" rx="16" fill="#FDECEC"/>
  <rect x="416" y="24" width="360" height="372" rx="16" fill="#E9F9F2"/>

  <text x="204" y="56" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#D14343" text-anchor="middle">✗ Đứng chụp từ trên xuống</text>
  <text x="596" y="56" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E9E6B" text-anchor="middle">✓ Ngang tầm mắt con vật</text>

  <!-- Panel trai: nguoi dung cao, cho be ti o xa -->
  <g>
    <line x1="60" y1="350" x2="350" y2="350" stroke="#9AA3AE" stroke-width="3"/>
    <circle cx="140" cy="140" r="16" fill="#F0C9A0"/>
    <rect x="124" y="156" width="32" height="90" rx="10" fill="#5AA9FF"/>
    <line x1="140" y1="246" x2="140" y2="350" stroke="#5AA9FF" stroke-width="10" stroke-linecap="round"/>
    <line x1="150" y1="150" x2="280" y2="335" stroke="#D14343" stroke-width="2.5" stroke-dasharray="6 5"/>
    <!-- cho be -->
    <g transform="translate(280,340) scale(0.5)">
      <ellipse cx="0" cy="0" rx="28" ry="16" fill="#B5651D"/>
      <circle cx="-24" cy="-10" r="14" fill="#B5651D"/>
      <ellipse cx="-30" cy="-18" rx="6" ry="10" fill="#8A4A1F" transform="rotate(-20 -30 -18)"/>
    </g>
  </g>

  <!-- Panel phai: nguoi cui thap, cho to ro ngang tam mat -->
  <g>
    <line x1="440" y1="350" x2="760" y2="350" stroke="#9AA3AE" stroke-width="3"/>
    <g fill="#9FB7C9" opacity="0.4">
      <circle cx="700" cy="260" r="16"/>
      <circle cx="730" cy="300" r="12"/>
    </g>
    <circle cx="500" cy="290" r="15" fill="#F0C9A0"/>
    <rect x="485" y="305" width="30" height="45" rx="10" fill="#5AA9FF"/>
    <g transform="translate(560,335)">
      <rect x="-10" y="-20" width="20" height="40" rx="5" fill="#1D1D1F"/>
      <rect x="-6" y="-15" width="12" height="30" rx="2" fill="#1E9E6B"/>
    </g>
    <line x1="540" y1="325" x2="625" y2="325" stroke="#1E9E6B" stroke-width="2.5" stroke-dasharray="6 5"/>
    <!-- cho to, ngang tam mat -->
    <g transform="translate(690,330) scale(1.3)">
      <ellipse cx="0" cy="0" rx="28" ry="16" fill="#B5651D"/>
      <circle cx="-24" cy="-12" r="15" fill="#B5651D"/>
      <ellipse cx="-30" cy="-22" rx="6" ry="10" fill="#8A4A1F" transform="rotate(-20 -30 -22)"/>
      <circle cx="-30" cy="-12" r="2.5" fill="#1D1D1F"/>
    </g>
  </g>
</svg>
