<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" rx="24" fill="#EEF1F6"/>

  <!-- Nhin tu tren xuong: hinh chu nhat la xe -->
  <g transform="translate(400,220)">
    <rect x="-90" y="-40" width="180" height="80" rx="18" fill="#7E9CB2"/>
    <rect x="-60" y="-28" width="50" height="56" rx="8" fill="#CFE6FF" opacity="0.8"/>
    <circle cx="-60" cy="-40" r="8" fill="#1D1D1F"/>
    <circle cx="-60" cy="40" r="8" fill="#1D1D1F"/>
    <circle cx="60" cy="-40" r="8" fill="#1D1D1F"/>
    <circle cx="60" cy="40" r="8" fill="#1D1D1F"/>

    <!-- Vi tri chup 0 do: thang mat truoc -->
    <circle cx="0" cy="-170" r="14" fill="#D14343"/>
    <line x1="0" y1="-156" x2="0" y2="-42" stroke="#D14343" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="0" y="-190" font-family="Arial, sans-serif" font-size="14" fill="#D14343" text-anchor="middle" font-weight="bold">0° - thẳng mặt (ít chiều sâu)</text>

    <!-- Vi tri chup 90 do: thang ben hong -->
    <circle cx="170" cy="0" r="14" fill="#D14343"/>
    <line x1="156" y1="0" x2="92" y2="0" stroke="#D14343" stroke-width="2.5" stroke-dasharray="6 5"/>
    <text x="230" y="5" font-family="Arial, sans-serif" font-size="14" fill="#D14343" text-anchor="middle" font-weight="bold">90°</text>

    <!-- Vi tri chup 3/4 (45 do) - KHUYEN NGHI -->
    <circle cx="-120" cy="-120" r="16" fill="#1E9E6B"/>
    <line x1="-108" y1="-108" x2="-55" y2="-55" stroke="#1E9E6B" stroke-width="3"/>
    <text x="-150" y="-140" font-family="Arial, sans-serif" font-size="15" fill="#1E9E6B" text-anchor="middle" font-weight="bold">✓ Góc 3/4 (~45°)</text>
    <text x="-150" y="-122" font-family="Arial, sans-serif" font-size="13" fill="#1E9E6B" text-anchor="middle">thấy cả đầu + hông xe</text>
  </g>

  <text x="400" y="400" font-family="Arial, sans-serif" font-size="14" fill="#5A6B7A" text-anchor="middle">Nhìn từ trên xuống - vị trí đứng chụp quanh xe</text>
</svg>
