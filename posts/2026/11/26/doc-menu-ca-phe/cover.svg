<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Hiểu ly cà phê trước khi gọi</title>
<desc id="desc">Sơ đồ thành phần espresso, Americano và latte. Các lớp màu chỉ minh họa thành phần, không biểu thị tỷ lệ hay phân tầng thực tế.</desc>
