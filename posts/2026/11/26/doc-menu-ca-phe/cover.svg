<g font-family="Arial, sans-serif" text-anchor="middle" fill="#33251f">
<text x="600" y="110" font-size="48" font-weight="700">MENU CÀ PHÊ CÓ GÌ?</text>
<text x="600" y="162" font-size="26">Hiểu thành phần · Chọn đúng khẩu vị</text>
<g stroke="#694d3e" stroke-width="6" stroke-linejoin="round">
<path d="M160 315h200l-18 205H178z" fill="#653c28"/>
<path d="M500 275h200l-18 245H518z" fill="#bdced4"/>
<path d="M518 438h164l-7 77H525z" fill="#653c28" stroke="none"/>
<path d="M840 275h200l-18 245H858z" fill="#ead5b5"/>
