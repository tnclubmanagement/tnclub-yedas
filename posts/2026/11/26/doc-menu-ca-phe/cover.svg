<path d="M844 280h192l-3 37H847z" fill="#fffaf2" stroke="none"/>
</g>
<g font-size="24" fill="#fffaf2"><text x="260" y="430">Espresso</text><text x="600" y="482">Espresso</text><text x="940" y="482">Espresso</text></g>
<g font-size="25"><text x="600" y="370">Nước</text><text x="940" y="376">Sữa</text></g>
<g font-size="30" font-weight="700"><text x="260" y="575">Espresso</text><text x="600" y="575">Americano</text><text x="940" y="575">Latte</text></g>
<text x="600" y="654" font-size="21">Sơ đồ thành phần, không phải tỷ lệ chuẩn hay các lớp thực tế · Yedas</text>
</g>
